services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lsn_user
      POSTGRES_PASSWORD: lsn_password
      POSTGRES_DB: lsn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsn_user -d lsn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://lsn_user:lsn_password@db:5432/lsn_db
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_RAZORPAY_KEY: ${VITE_RAZORPAY_KEY:-rzp_test_xxxxxxxxxxxxx}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
